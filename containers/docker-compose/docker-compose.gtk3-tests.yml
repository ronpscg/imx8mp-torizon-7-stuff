services:
  weston:
    cap_add:
    - CAP_SYS_TTY_CONFIG
    device_cgroup_rules:
    - c 4:0 rmw
    - c 4:1 rmw
    - c 4:7 rmw
    - c 13:* rmw
    - c 226:* rmw
    - c 199:0 rmw
    - c 253:* rmw
    - c 10:253 rmw
    environment:
    - ACCEPT_FSL_EULA=1
    - HEAD=LVDS-1
    image: torizon/weston-imx8:stable-rc
    network_mode: host
    volumes:
    - source: /tmp
      target: /tmp
      type: bind
    - source: /dev
      target: /dev
      type: bind
    - source: /run/udev
      target: /run/udev
      type: bind
  test-gtk3:
    device_cgroup_rules:
    - c 81:* rmw
    - c 199:* rmw
    - c 226:* rmw
    - c 234:* rmw
    - c 235:* rmw
    - c 253:* rmw
    entrypoint: "gtk3-demo --run=fishbowl"
    image: torizon/gtk3-tests-imx8:stable-rc
    restart: unless-stopped
    security_opt:
    - seccomp=unconfined
    shm_size: 512mb
    volumes:
    - /tmp:/tmp
    - /var/run/dbus:/var/run/dbus
    - /dev:/dev
    - /dev/galcore:/dev/galcore
